[project]
name = "multimodal-har"
version = "0.1.0"
description = "Multimodal Human Activity Recognition using UTD-MHAD (RGB video + inertial sensors)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchaudio>=2.0",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "tqdm>=4.60",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "timm>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
